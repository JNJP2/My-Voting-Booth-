services:
  - type: web
    name: my-voting-booth
    runtime: python
    plan: free
    buildCommand: "echo no build step"
    startCommand: python3 server.py
    healthCheckPath: /healthz
    envVars:
      - key: GOOGLE_CIVIC_API_KEY
        sync: false   # you enter this in the Render dashboard; never commit it
      - key: PYTHON_VERSION
        value: "3.11.9"
