<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Voting Booth</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b2430; --muted:#5d6b7c; --line:#dfe4ea; --accent:#1f4fbf;
          --dem:#2457c5; --rep:#c0342b; --lib:#b8860b; --grn:#2e8b57; --other:#6b7280; --navy:#14275a; --navy2:#2a4aa8; --red:#d6403a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12161c; --card:#1b212a; --ink:#e8ecf1; --muted:#9aa7b6; --line:#2d3643; --accent:#7ba3ff;
            --dem:#6c9bff; --rep:#ff7a70; --lib:#e6b84a; --grn:#5cc58a; --other:#9aa3b0; --navy:#0d1a3d; --navy2:#1f3a85; --red:#c7352f; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  .hero { position:relative; overflow:hidden; color:#fff; text-align:center; padding:44px 16px 64px;
          background:radial-gradient(circle at 20% 20%, rgba(255,255,255,.12) 0, transparent 40%), linear-gradient(135deg,var(--navy),var(--navy2)); }
  .hero::before { content:"\2605  \2605  \2605  \2605  \2605"; display:block; letter-spacing:.6em; font-size:.9rem; color:#ffd966; margin-bottom:10px; }
  .hero::after { content:""; position:absolute; left:0; right:0; bottom:0; height:10px;
                 background:repeating-linear-gradient(90deg,var(--red) 0 40px,#fff 40px 80px); }
  .hero h1 { font-size:clamp(2rem,6vw,3rem); margin:0; letter-spacing:-.02em; }
  .hero h1 .box { display:inline-block; animation:bob 3s ease-in-out infinite; }
  @keyframes bob { 50% { transform:translateY(-5px) rotate(-6deg); } }
  .sub { margin:10px auto 0; max-width:560px; opacity:.92; }
  main { max-width:820px; margin:-34px auto 0; padding:0 16px 64px; position:relative; }
  .search { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:0 10px 30px rgba(20,39,90,.18); }
  form { display:flex; gap:8px; flex-wrap:wrap; }
  input { flex:1 1 280px; padding:12px 14px; font-size:1rem; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); }
  button { padding:12px 22px; font-size:1rem; border:0; border-radius:8px; background:linear-gradient(135deg,var(--red),#e8644e); color:#fff; font-weight:700; cursor:pointer; transition:transform .12s, box-shadow .12s; }
  button:hover:not(:disabled) { transform:translateY(-1px); box-shadow:0 4px 12px rgba(214,64,58,.4); }
  input:focus { outline:3px solid color-mix(in srgb,var(--accent) 35%,transparent); border-color:var(--accent); }
  button:disabled { opacity:.6; cursor:wait; }
  .note { font-size:.85rem; color:var(--muted); margin-top:8px; }
  .banner { background:#fff4d6; color:#5c4500; border:1px solid #f0d98a; padding:10px 14px; border-radius:8px; margin-top:16px; font-size:.9rem; }
  .error { background:#fde8e6; color:#7a1d16; border:1px solid #f3b8b3; padding:12px 14px; border-radius:8px; margin-top:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-left:5px solid var(--accent); border-radius:12px; padding:16px 18px; margin-top:14px; animation:rise .4s ease both; transition:transform .15s, box-shadow .15s; }
  .card:hover { transform:translateY(-2px); box-shadow:0 6px 18px rgba(20,39,90,.12); }
  @keyframes rise { from { opacity:0; transform:translateY(8px); } }
  .lvl-federal .card { border-left-color:var(--red); } .lvl-state .card { border-left-color:var(--navy2); } .lvl-local .card { border-left-color:#e0a21b; } .lvl-where .card { border-left-color:var(--grn); }
  h2 { font-size:1.3rem; margin:34px 0 0; display:flex; align-items:center; gap:10px; }
  h2 .ico { display:inline-grid; place-items:center; width:36px; height:36px; border-radius:50%; background:var(--navy); font-size:1.05rem; }
  @media (prefers-reduced-motion:reduce) { * { animation:none !important; transition:none !important; } }
  h3 { font-size:1.05rem; margin:0; }
  .district { color:var(--muted); font-size:.85rem; margin-bottom:8px; }
  ul { list-style:none; margin:0; padding:0; }
  li.cand { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:8px 0; border-top:1px solid var(--line); }
  li.cand:first-child { border-top:0; }
  .pill { font-size:.78rem; font-weight:600; padding:2px 10px; border-radius:999px; border:1px solid currentColor; white-space:nowrap; }
  .Democratic { color:var(--dem); } .Republican { color:var(--rep); } .Libertarian { color:var(--lib); } .Green { color:var(--grn); } .Other { color:var(--other); }
  .loc-name { font-weight:600; } .loc-meta { color:var(--muted); font-size:.9rem; }
  a { color:var(--accent); }
  .quiz summary { cursor:pointer; } .quiz fieldset { border:0; border-top:1px solid var(--line); margin:14px 0 0; padding:12px 0 0; }
  .quiz legend { padding:0; font-size:.95rem; } .opts { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .opts label { cursor:pointer; } .opts input { position:absolute; opacity:0; }
  .opts span { display:inline-block; padding:6px 10px; border:1px solid var(--line); border-radius:999px; font-size:.82rem; }
  .opts input:checked + span { background:var(--navy2); color:#fff; border-color:var(--navy2); }
  .opts input:focus-visible + span { outline:3px solid var(--accent); }
  .imp { display:block; margin-top:8px; font-size:.85rem; color:var(--muted); } select { padding:4px 8px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--ink); }
  button.ghost { background:transparent; color:var(--muted); border:1px solid var(--line); }
  .quiz form { display:block; } /* the search form's flex layout was stretching these buttons tall */
  .quiz form > button { margin-top:16px; }
  .rules li { padding:4px 0; } .rules .imp { margin-top:12px; } .rules summary { cursor:pointer; }
  .gauge { position:relative; height:14px; border-radius:999px; margin:34px 6px 8px; background:linear-gradient(90deg,#3b6fd4,#8a7fc8 50%,#d6403a); }
  .gauge .dot { position:absolute; top:50%; width:26px; height:26px; margin:-13px 0 0 -13px; border-radius:50%; background:#fff; border:4px solid var(--navy); box-shadow:0 2px 8px rgba(0,0,0,.3); transition:left .6s cubic-bezier(.3,1.4,.5,1); }
  .gauge-ends { display:flex; justify-content:space-between; font-size:.8rem; color:var(--muted); }
  .lean-label { font-size:1.35rem; font-weight:700; } .chip { font-size:.78rem; padding:2px 9px; border-radius:999px; border:1px solid var(--line); color:var(--muted); white-space:nowrap; }
  details summary { cursor:pointer; color:var(--accent); font-size:.85rem; margin-top:4px; }
  .cmp { width:100%; font-size:.82rem; border-collapse:collapse; margin-top:6px; } .cmp th,.cmp td { text-align:left; padding:4px 6px; border-top:1px solid var(--line); }
  .tabs { display:flex; gap:6px; margin-top:12px; flex-wrap:wrap; }
  .meta { color:var(--muted); font-size:.9rem; margin-top:4px; }
</style>
</head>
<body>
<header class="hero">
    <h1><span class="box">🗳️</span> My Voting Booth</h1>
    <p class="sub">Enter your address to see every race on your ballot, who's running, and where to cast your vote.</p>
  </header>
<main>
  <div class="search">
  <form id="f">
    <input id="addr" autocomplete="street-address" placeholder="Street address, or just a ZIP code" required aria-label="Home address or ZIP code">
    <button id="go">Look up</button>
  </form>
  <div class="note">Your address is sent only to the lookup service to find your districts and is not stored or logged.</div>
  </div>
  <div id="rules"></div>
  <div id="quiz"></div>
  <div id="out" aria-live="polite"></div>
</main>
<script src="/match.js"></script>
<script src="/rules.js"></script>
<script>
let last = null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(u) ? u : "";
const partyClass = p => /democrat/i.test(p) ? "Democratic" : /republican/i.test(p) ? "Republican"
  : /libertarian/i.test(p) ? "Libertarian" : /green/i.test(p) ? "Green" : "Other";

function candidate(c) {
  const name = safeUrl(c.url) ? `<a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.name)}</a>` : esc(c.name);
  return `<li class="cand"><span>${name}</span><span class="pill ${partyClass(c.party)}">${esc(c.party)}</span></li>`;
}

function contest(c) {
  let body;
  if (c.candidates.length) {
    const sorted = [...c.candidates].sort((a, b) => a.party.localeCompare(b.party));
    body = `<ul>${sorted.map(candidate).join("")}</ul>`;
  } else {
    body = `${c.text ? `<p>${esc(c.text)}</p>` : ""}${c.options?.length ? `<p class="meta">Choices: ${c.options.map(esc).join(" / ")}</p>` : ""}`;
  }
  if (c.supplemental) {
    const src = c.source || {};
    body += `<p class="meta">${esc(src.name || "Statewide list")}${safeUrl(src.url) ? ` <a href="${esc(src.url)}" target="_blank" rel="noopener">Official site</a>` : ""}</p>`;
  }
  const cat = c.category ? `<span class="chip">${esc(c.category)}</span> ` : "";
  return `<div class="card"><h3>${esc(c.office)}</h3><div class="district">${cat}${esc(c.district)}</div>${body}</div>`;
}

function locations(title, list) {
  if (!list.length) return "";
  return `<section class="lvl-where"><h2><span class="ico">📍</span>${title}</h2>` + list.map(l => `<div class="card"><div class="loc-name">${esc(l.name)}</div>
    <div>${esc(l.address)}</div>
    <div class="loc-meta">${[l.hours, l.startDate && `${l.startDate}${l.endDate ? " to " + l.endDate : ""}`, l.notes].filter(Boolean).map(esc).join(" · ")}</div>
    <a class="loc-meta" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(l.address)}">Directions</a></div>`).join("") + `</section>`;
}

function render(d) {
  const groups = [["federal", "🇺🇸", "Federal races"], ["state", "🏛️", "State races"], ["local", "🏘️", "Local races & measures"]];
  const n = d.normalizedAddress || {};
  let h = "";
  if (d.demo) h += `<div class="banner"><b>Demo mode:</b> showing sample data, not your real ballot. Start the server with a <code>GOOGLE_CIVIC_API_KEY</code> for live results.</div>`;
  h += `<h2 style="margin-top:24px">${esc(d.election.name || "Upcoming election")}</h2>
    <div class="meta">${esc(d.election.date || "")} · ${esc([n.line1, n.city, n.state, n.zip].filter(Boolean).join(", "))}</div>`;
  if (d.zipOnly) h += `<div class="banner"><b>ZIP code preview (${esc(d.zipOnly)}):</b> based on one location in this ZIP. A ZIP code can span several districts, so some races and your polling place may differ at your actual address. Enter your full address for exact results.</div>`;
  if (d.matchedAs) h += `<div class="banner">We couldn't find the address exactly as typed, so we searched for <b>${esc(d.matchedAs)}</b>. If that's not your address, try again with the full street, city, state and ZIP.</div>`;
  for (const [key, icon, title] of groups) {
    const items = d.contests.filter(c => c.level === key);
    if (items.length) h += `<section class="lvl-${key}"><h2><span class="ico">${icon}</span>${title}</h2>` + items.map(contest).join("") + `</section>`;
  }
  if (d.noData && d.supplemented) h += `<div class="banner"><b>Your address was recognized, but our data source has no local races or polling place for it yet.</b> The statewide measures below come from a separate statewide list, and your ballot may include more (local races and measures). Use the official links below to see your full ballot and polling place.</div>`;
  else if (d.noData) h += `<div class="banner"><b>Your address was recognized, but no ballot or polling-place data is published for it yet.</b> This is a gap in the data source, not a problem with your address. Use the official links below to see your ballot and find your polling place.</div>`;
  else if (!d.contests.length) h += `<div class="card">No contests are published for this address yet. Check back closer to the election, or visit your state election office below.</div>`;
  h += locations(d.zipOnly ? "Example polling place nearby" : "Your polling place", d.pollingLocations);
  h += locations("Early voting sites", d.earlyVoteSites);
  h += locations("Ballot drop-off locations", d.dropOffLocations);
  const o = d.officials || {};
  const links = [[o.registrationUrl, "Check or update your registration"], [o.ballotInfoUrl, "Ballot information"],
                 [o.votingLocationFinderUrl, "Official polling place finder"], [o.url, "Election office website"]]
    .filter(([u]) => safeUrl(u)).map(([u, t]) => `<li><a href="${esc(u)}" target="_blank" rel="noopener">${t}</a></li>`).join("");
  if (links) h += `<h2>${esc(o.name || "Election officials")}</h2><div class="card"><ul>${links}</ul></div>`;
  h += `<p class="note">Always confirm with your official election office. Candidate lists and locations can change.</p>`;
  $("#out").innerHTML = h;
  Rules.setState(n.state, d.officials);
}
Match.init($("#quiz")).catch(() => {});
Rules.init($("#rules")).catch(() => {});

$("#f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("#go"); btn.disabled = true; btn.textContent = "Looking up…"; $("#out").innerHTML = "";
  try {
    const r = await fetch("/api/lookup?address=" + encodeURIComponent($("#addr").value));
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Lookup failed");
    last = d; render(d);
  } catch (err) {
    $("#out").innerHTML = `<div class="error">${esc(err.message)}</div>`;
  } finally { btn.disabled = false; btn.textContent = "Look up"; }
});
</script>
</body>
</html>
